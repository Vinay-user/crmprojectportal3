# =====================================================================
# CRM Portal backend - application.properties
# Configured for a local XAMPP MySQL server.
# =====================================================================

spring.application.name=crm-portal

server.port=8080
# Frontend calls http://localhost:8080/api/... (see frontend/src/config/config.js)
server.servlet.context-path=/

# ---------------------------------------------------------------------
# MySQL (XAMPP) - default XAMPP root user has NO password
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/crm_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# The database schema is created by database/schema.sql (run manually
# via phpMyAdmin or the mysql CLI, per the database README), so
# Hibernate is told NOT to generate/alter the schema - only to map
# entities onto the tables that already exist.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# Jackson
# ---------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------------
# Auth (temporary, simple)
# No hashing, no JWT yet - see com.crm.portal.security.TokenService.
# Tokens are random and kept in memory only, so they don't survive an
# app restart. crm.auth.token-expiration-ms controls how long a login
# session stays valid (default: 24h).
# ---------------------------------------------------------------------
crm.auth.token-expiration-ms=86400000

# ---------------------------------------------------------------------
# CORS - the React dev server (Vite) origin
# ---------------------------------------------------------------------
crm.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.crm.portal=DEBUG
